<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --bg-color: #121212; --text-color: #ffffff; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 16px;
            transition: all 0.3s ease;
        }

        h2 { font-weight: 500; margin-bottom: 20px; }

        /* Tarjetas de la Lista - Estilo imagen_67c4cf.png */
        /* Estilo mejorado para que las "cajitas" resalten */
.item-lista {
    background-color: rgba(255, 255, 255, 0.15); /* Aumentamos opacidad para que se vea más claro */
    border: 1.5px solid rgba(255, 255, 255, 0.2); /* Borde sutil para dar definición */
    border-radius: 20px; /* Redondeo Material 3 (16px-28px) */
    padding: 18px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); /* Añadimos sombra (elevación) para que "salte" del fondo */
    transition: transform 0.2s;
}

/* Efecto al presionar para que se sienta nativo */
.item-lista:active {
    transform: scale(0.98);
    background-color: rgba(255, 255, 255, 0.25);
}
        .item-info { flex-grow: 1; margin-left: 15px; }

.item-titulo {
    font-weight: 700;
    font-size: 1.15em;
    display: block;
    margin-bottom: 2px;
}

.item-sub {
    font-size: 0.95em;
    opacity: 0.9;

}

        /* Botón de Borrar (Icono de basura) */
        .btn-delete {
            background: rgba(255, 0, 0, 0.1);
            border: none; border-radius: 50%;
            width: 40px; height: 40px; color: #ff5555;
            cursor: pointer; font-size: 18px;
        }

        /* Inputs de Formulario - Estilo imagen_67c479.png */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; font-weight: bold; }

        input {
            width: 100%; box-sizing: border-box;
            padding: 12px; background: rgba(255,255,255,0.05);
            border: 2px solid var(--text-color);
            border-radius: 12px; color: var(--text-color);
            font-size: 1em;
        }

        /* Botones de Acción */
        .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-flat { background: transparent; color: var(--text-color); border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; }
        .btn-primary { background: var(--text-color); color: var(--bg-color); border: none; padding: 10px 25px; font-weight: bold; border-radius: 8px; }

        /* FAB - Botón Flotante */
        .fab {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; border-radius: 18px;
            background-color: var(--text-color); color: var(--bg-color);
            font-size: 32px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .oculto { display: none; }
    </style>
</head>
<body>

<h2 id="texto">Cargando...</h2>

<div id="pantalla-lista">
    <div id="contenedor-items"></div>
    <button class="fab" onclick="mostrarFormularioCrear()">+</button>
</div>

<div id="pantalla-formulario" class="oculto">
    <h3 id="form-titulo">✨ Crear nuevo ítem</h3>

    <div class="form-group">
        <label>Título *</label>
        <input type="text" id="input-titulo" placeholder="Ej: React Native">
    </div>

    <div class="form-group">
        <label>Subtítulo</label>
        <input type="text" id="input-sub" placeholder="Ej: Descripción corta">
    </div>

    <div class="actions">
        <button class="btn-flat" onclick="volver()">CANCELAR</button>
        <button class="btn-primary" id="btn-accion" onclick="procesarFormulario()">CREAR</button>
    </div>
</div>

<script>
    let items = [
        { id: "1", titulo: "Componentes UI", sub: "android.widget.Button", img: "📱" },
        { id: "2", titulo: "FlatList", sub: "RecyclerView nativo", img: "📋" }
    ];

    let editandoId = null;

    function renderizarLista() {
        const lista = document.getElementById('contenedor-items');
        lista.innerHTML = "";
        items.forEach(item => {
            lista.innerHTML += `
                <div class="item-lista">
                    <div style="font-size: 30px;">${item.img}</div>
                    <div class="item-info" onclick="mostrarFormularioEditar('${item.id}')">
                        <span class="item-titulo">${item.titulo}</span>
                        <span class="item-sub">${item.sub}</span>
                    </div>
                    <button class="btn-delete" onclick="eliminar('${item.id}')">✘</button>
                </div>`;
        });
    }

    function mostrarFormularioCrear() {
        editandoId = null;
        document.getElementById('form-titulo').innerText = "✨ Crear nuevo ítem ✨";
        document.getElementById('btn-accion').innerText = "CREAR";
        document.getElementById('input-titulo').value = "";
        document.getElementById('input-sub').value = "";
        cambiarPantalla();
    }

    function mostrarFormularioEditar(id) {
        const item = items.find(i => i.id === id);
        editandoId = id;
        document.getElementById('form-titulo').innerText = "✎𓂃 Editar ítem ";
        document.getElementById('btn-accion').innerText = "ACTUALIZAR";
        document.getElementById('input-titulo').value = item.titulo;
        document.getElementById('input-sub').value = item.sub;
        cambiarPantalla();
    }

    function procesarFormulario() {
        const tit = document.getElementById('input-titulo').value;
        const sub = document.getElementById('input-sub').value;

        if(tit.trim() === "") {
            Android.showToast("El título es obligatorio");
            return;
        }

        if(editandoId) {
            // Lógica de UPDATE
            items = items.map(i => i.id === editandoId ? {...i, titulo: tit, sub: sub} : i);
            Android.showToast("Ítem actualizado");
        } else {
            // Lógica de CREATE
            items.push({ id: Date.now().toString(), titulo: tit, sub: sub, img: "🚀" });
            Android.showToast("Ítem creado");
        }
        volver();
    }

    function eliminar(id) {
        Android.showDeleteDialog(id.toString());
    }

    function confirmDelete(id) {
        items = items.filter(i => i.id.toString() !== id.toString());
        renderizarLista();
    }

    function volver() {
        document.getElementById('pantalla-formulario').classList.add('oculto');
        document.getElementById('pantalla-lista').classList.remove('oculto');
        renderizarLista();
    }

    function cambiarPantalla() {
        document.getElementById('pantalla-lista').classList.add('oculto');
        document.getElementById('pantalla-formulario').classList.remove('oculto');
    }

    window.onload = renderizarLista;
</script>
</body>
</html>
